# ====================================================================
# Tmux Configuration (Optimized for macOS & Neovim)
# ====================================================================

# --------------------------------------------------------------------
# 1. 终端与核心行为设置
# --------------------------------------------------------------------
# 开启 24-bit True Color (解决 Neovim 颜色发白/失真问题)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 消除 Neovim 按下 ESC 键的延迟 (原为 200，现改为 10)
set -sg escape-time 10
set -g display-time 3000                 # 消息栏显示时间 (ms)
set -g history-limit 65535               # 历史回滚行数

# 窗口序号从 1 开始，并允许自动重新编号
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-window-option -g allow-rename off    # 禁用窗口标题自动重命名
setw -g aggressive-resize on             # 允许更激进的调整大小

# 开启鼠标支持 (极其好用：支持滚轮查看历史、点击切换窗格、拖拽调整大小)
set -g mouse on

# --------------------------------------------------------------------
# 2. 快捷键映射 (Key Bindings)
# --------------------------------------------------------------------
# 使用 vi 模式的按键映射
set-window-option -g mode-keys vi
set-option -g status-keys vi

# 重新加载配置
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# 新建窗口/窗格时保留当前目录，并使用更直观的 | 和 - 进行分屏
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# bind | split-window -h -c "#{pane_current_path}"
# bind - split-window -v -c "#{pane_current_path}"
# unbind '"'
# unbind %

# Vim 风格的窗格切换
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R
bind-key o select-window -l # 切换到上一个窗口

# 调整窗格大小 (Prefix + Shift + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 打通 macOS 系统剪贴板 (按 v 选中，按 y 复制到 Mac 剪贴板)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# --------------------------------------------------------------------
# 3. UI 与状态栏美化 (保留原有的高对比度绿/黑风格)
# --------------------------------------------------------------------
# 窗格边框颜色
set -g display-panes-active-colour blue
set -g display-panes-colour colour250

# 状态栏基础设置
set -g status-bg black
set -g status-fg green
set-option -g status-justify centre
set -g status-interval 5

# 左侧与右侧状态显示
set-option -g status-left '#[bg=black,fg=green][#[fg=cyan]#S#[fg=green]] '
set -g status-right-length 50
# set -g status-right '#[fg=green][#[fg=cyan]%H:%M %Y/%m/%d#[fg=green]] #[fg=cyan]#H'
set -g status-right '#[fg=cyan]#H'

