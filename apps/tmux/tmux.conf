# 1. Zero-width separator to create a continuous bar
setw -g window-status-separator ""
# 2. Inactive Windows: Low-contrast grays (recades into the background)
#    Format: [Dark Gray padding] [Lighter Gray text & background]
setw -g window-status-format "#[fg=colour243,bg=colour237] #[fg=colour250,bg=colour240] #I:#W "
# 3. Active Window: Cyan block with a sharp pointer '❱', black text for high contrast
#    Format: [Cyan pointer] [Cyan background, Black text]
setw -g window-status-current-format "#[fg=cyan,bg=colour237]❱#[bold,fg=black,bg=cyan] #I:#W "

# 时钟与活动监控
setw -g clock-mode-colour green
setw -g clock-mode-style 24
set -g visual-activity on
setw -g monitor-activity on


